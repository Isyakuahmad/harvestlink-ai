[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="harvestlink-ai"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","sqlalchemy>=2,<3","alembic>=1.13,<2","pydantic-settings>=2.5,<3","email-validator>=2.2,<3","pwdlib[argon2]>=0.2,<1","PyJWT>=2.9,<3"]
[project.optional-dependencies]
dev=["pytest>=8.3,<9","httpx>=0.27,<1","ruff>=0.6,<1"]
[tool.setuptools]
package-dir={""="backend"}
[tool.setuptools.packages.find]
where=["backend"]
[tool.pytest.ini_options]
pythonpath=["backend"]
testpaths=["tests"]
[tool.ruff]
line-length=100
target-version="py311"
